<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Estado de Salud Vegetal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="badge">Análisis Predictivo</div>
            <h1>Estado de Salud Vegetal</h1>
            <p class="subtitle">Ingresa las variables para clasificar el estado más cercano</p>
        </div>

        <form id="evaluarForm">
            <!-- 1. Especie -->
            <div class="form-group">
                <label for="especie">Especie <span class="unit-tag">(Parametrizada)</span></label>
                <select id="especie" name="especie" required>
                    <option value="" disabled selected>-- Selecciona una especie --</option>
                    {% for esp in especies %}
                    <option value="{{ esp }}">{{ esp }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 2, 3 y 4. Luminosidad, Humedad y Temperatura -->
            <div class="form-group">
                <div class="inputs-grid">
                    <div>
                        <label for="luminosidad">Luminosidad <span class="unit-tag">(lm)</span></label>
                        <input type="number" step="any" id="luminosidad" name="luminosidad" placeholder="Ej. 550" min="0" required>
                    </div>
                    <div>
                        <label for="humedad">Humedad <span class="unit-tag">(%)</span></label>
                        <input type="number" step="any" id="humedad" name="humedad" placeholder="Ej. 55" min="0" max="100" required>
                    </div>
                    <div>
                        <label for="temperatura">Temperatura <span class="unit-tag">(°C)</span></label>
                        <input type="number" step="any" id="temperatura" name="temperatura" placeholder="Ej. 22" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="btnEvaluar">
                <span>Determinar Categoría</span>
                <span>➔</span>
            </button>
        </form>

        <!-- Tarjeta de Categoría Detectada -->
        <div class="category-card" id="categoryCard">
            <div class="category-title">Categoría / Estado Más Cercano</div>
            <div class="category-badge" id="categoryValue">--</div>
            <div style="font-size: 0.85rem; color: var(--text-muted);" id="evalInfo"></div>
        </div>
    </div>

    <!-- Enlace al controlador JavaScript externo -->
    <script src="{{ url_for('controlador_js') }}"></script>
</body>

</html>
